name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repository checks
        run: python3 tools/check.py
      - name: Example analysis reproduces
        run: |
          python3 example/data-folder/home-bp-app/generate.py --check
          python3 example/analyses/2026-11-19_home-bp-app-flag/analysis.py --check
